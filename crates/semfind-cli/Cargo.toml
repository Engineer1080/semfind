[package]
name = "semfind-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline semantic search CLI for Linux files, applications, COSMIC settings, and commands"
rust-version.workspace = true

[[bin]]
name = "semfind"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
semfind-core = { path = "../semfind-core" }
serde = "1"
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event", "net", "process"] }
sha2 = "0.10"
