[package]
name = "semfind-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline Linux search CLI for files, applications, COSMIC settings, and commands"
rust-version.workspace = true

[[bin]]
name = "semfind"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
semfind-core = { path = "../semfind-core" }
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
