name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.0 fmt --all --check
      - run: cargo +1.93.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.93.0 test --locked --workspace
      - run: cargo +1.93.0 build --locked --workspace --release

  real-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements.txt
      - name: Verify PDF and multilingual retrieval
        run: |
          export SEMFIND_PYTHON="$(command -v python)"
          export SEMFIND_MODEL_DIR="$RUNNER_TEMP/semfind-model"
          python scripts/download_model.py
          cargo +1.93.0 test --locked -p semfind-cli --test cli real_model -- --ignored

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-deny --version 0.21.0 --locked
      - run: cargo +stable deny --locked check
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
