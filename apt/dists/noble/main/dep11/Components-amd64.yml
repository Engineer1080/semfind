Package: semfind-gui
ProjectLicense: Apache-2.0
Name:
  C: Semfind
Summary:
  C: Offline semantic search for files, apps, and Linux commands
  de: Lokale semantische Suche für Dateien, Apps und Linux-Befehle
Description:
  C: >-
    <p>Describe what you're looking for in everyday language. Semfind finds files by their
        contents, installed apps by what they do, and Linux commands by the task you want to
        accomplish. The multilingual model can find an English document from a German question.</p>
    <p>Filter results by category, read matching passages with line or page references, and
        open files and applications directly. Copy Linux command examples to the clipboard.</p>
    <p>Choose individual folders or index your home directory. After you download the model,
        searches run offline. The desktop app shares its index with the Semfind CLI.</p>
  de: >-
    <p>Beschreibe in Alltagssprache, was du suchst. Semfind findet Dateien
        nach Inhalt, installierte Programme nach ihrer Funktion und Linux-Befehle nach der
        gewünschten Aufgabe. Eine deutsche Frage kann auch ein englisches Dokument finden.</p>
    <p>Filtere Treffer nach Kategorie und lies passende Textausschnitte mit
        Zeilen- oder Seitenangaben. Öffne Dateien und Programme direkt oder kopiere Beispiele
        für Linux-Befehle in die Zwischenablage.</p>
    <p>Wähle einzelne Ordner oder indexiere dein Home-Verzeichnis. Nach dem
        Modelldownload funktioniert die Suche offline. Die Desktop-App nutzt denselben Index
        wie der Terminalbefehl semfind.</p>
